<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Kenzoku — Of Iris and Wren</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":133256340,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
// Pasted into the exported index.html by publish_web.ps1, after `const engine = new Engine(...)`.
// GitHub refuses files over 100 MB, so the game file (index.pck) is published in parts
// (index.pck.000, .001, ...). This fetches the parts, joins them and starts the game with the
// result, in place of Godot's engine.startGame (which fetches one index.pck).
const GODOT_PCK_PARTS = [{"file":"index.pck.000","size":48000000},{"file":"index.pck.001","size":48000000},{"file":"index.pck.002","size":37256340}];     // [{"file": "index.pck.000", "size": 48000000}, ...]
const GODOT_PCK_VERSION = "be55974";  // cache buster: a new build gets new URLs

function startSplitGame(override) {
	const total = GODOT_PCK_PARTS.reduce((s, p) => s + p.size, 0);
	const got = GODOT_PCK_PARTS.map(() => 0);
	let wasm = [0, GODOT_CONFIG.fileSizes[GODOT_CONFIG.executable + '.wasm'] || 0];
	const report = () => override.onProgress(wasm[0] + got.reduce((a, b) => a + b, 0), wasm[1] + total);
	engine.config.update({ onProgress: (cur, tot) => { wasm = [cur, tot || wasm[1]]; report(); } });

	function fetchPart(i, attempts) {
		got[i] = 0;
		return fetch(GODOT_PCK_PARTS[i].file + '?v=' + GODOT_PCK_VERSION).then(async (res) => {
			if (!res.ok) {
				throw new Error(`Failed loading file '${GODOT_PCK_PARTS[i].file}'`);
			}
			const buf = new Uint8Array(GODOT_PCK_PARTS[i].size);
			const reader = res.body.getReader();
			for (;;) {
				const { done, value } = await reader.read();
				if (done) break;
				buf.set(value, got[i]);
				got[i] += value.length;
				report();
			}
			if (got[i] !== buf.length) {
				throw new Error(`'${GODOT_PCK_PARTS[i].file}' was cut short`);
			}
			return buf;
		}).catch((err) => {
			if (attempts <= 1) throw err;
			return new Promise((r) => setTimeout(r, 1000)).then(() => fetchPart(i, attempts - 1));
		});
	}

	return Promise.all([
		engine.init(GODOT_CONFIG.executable),
		Promise.all(GODOT_PCK_PARTS.map((_, i) => fetchPart(i, 4))),
	]).then(([, parts]) => {
		const pck = new Uint8Array(total);
		let at = 0;
		for (const p of parts) {
			pck.set(p, at);
			at += p.length;
		}
		return engine.preloadFile(pck, 'index.pck');
	}).then(() => engine.start({ args: ['--main-pack', 'index.pck'].concat(GODOT_CONFIG.args) }));
}


(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		startSplitGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
